name: CI

# Roda a cada push e a cada Pull Request.
# O PR só deve ser integrado com este check verde.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-e-testes:
    runs-on: ubuntu-latest

    # Os testes usam um PostgreSQL em memória (PGlite), criado a partir das
    # migrations do Prisma. Por isso o CI não precisa de banco nem de senha:
    # o endereço do Neon (DATABASE_URL) nunca entra aqui.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Rodar os testes
        run: npm test

      - name: Verificar se a aplicação sobe
        run: |
          npm start &
          sleep 3
          curl --fail http://localhost:3000/api/saude
